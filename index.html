<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴스 딱 1개로 5일 만에 팔로워 +1,000명</title>
<meta name="description" content="@lilcherry.ai.maker 인스타그램 성장 사례 강연 덱">
<style>
  :root{--bg:#F8DCE8;--nav:#D23A6E;--nav-dark:#B92F5E}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
  .slide{min-height:100vh;display:grid;place-items:center;padding:0;background:var(--bg);scroll-snap-align:start}
  .deck-image{display:block;width:min(100vw,calc(100vh * 16 / 9));height:auto;max-height:100vh;aspect-ratio:16/9;object-fit:contain}
  .slide-link{display:block;line-height:0;color:inherit;text-decoration:none}
  .navbtn{position:fixed;top:50%;transform:translateY(-50%);z-index:20;width:48px;height:64px;border:0;background:rgba(210,58,110,.92);color:#fff;border-radius:999px;font-size:34px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 12px 28px rgba(163,30,82,.24)}
  .navbtn.prev{left:18px}.navbtn.next{right:18px}
  .navbtn:hover{background:var(--nav-dark)}
  .navbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  @media (max-width:760px){.navbtn{width:38px;height:52px;font-size:26px}.navbtn.prev{left:8px}.navbtn.next{right:8px}.deck-image{width:100vw;max-height:none}}
</style>
</head>
<body>
<main>
  <section class="slide" data-slide="1"><a class="slide-link" href="https://www.instagram.com/lilcherry.ai.maker/" target="_blank" rel="noopener"><img class="deck-image" src="assets/figma-slides/slide-01.png" alt="슬라이드 1"></a></section>

  <section class="slide" data-slide="5"><img class="deck-image" src="assets/figma-slides/slide-05.png" alt="슬라이드 5"></section>
  <section class="slide" data-slide="6"><img class="deck-image" src="assets/figma-slides/slide-06.png" alt="슬라이드 6"></section>
  <section class="slide" data-slide="7"><a class="slide-link" href="https://www.instagram.com/reel/DayNXmByPhP/?utm_source=ig_web_copy_link&igsi=MzRlODBiNWFlZA==" target="_blank" rel="noopener"><img class="deck-image" src="assets/figma-slides/slide-07.png" alt="슬라이드 7"></a></section>

</main>
<button class="navbtn prev" type="button" aria-label="이전 슬라이드">&lt;</button>
<button class="navbtn next" type="button" aria-label="다음 슬라이드">&gt;</button>
<script>
  const slides=[...document.querySelectorAll('.slide')];
  let current=0;
  function activeIndex(){
    const middle=window.scrollY+window.innerHeight/2;
    let best=0,dist=Infinity;
    slides.forEach((s,i)=>{const d=Math.abs(s.offsetTop+s.offsetHeight/2-middle);if(d<dist){dist=d;best=i;}});
    return best;
  }
  function go(delta){
    current=Math.max(0,Math.min(slides.length-1,activeIndex()+delta));
    slides[current].scrollIntoView({behavior:'smooth',block:'start'});
  }
  document.querySelector('.navbtn.prev').addEventListener('click',()=>go(-1));
  document.querySelector('.navbtn.next').addEventListener('click',()=>go(1));
  window.addEventListener('keydown',e=>{
    if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1);}
    if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
  });
</script>
</body>
